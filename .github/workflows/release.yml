name: Release

# Триггер — пуш git-тега вида v1.2.3. Собирает ПОДПИСАННЫЙ release-APK
# (R8 + shrinkResources) и публикует его в GitHub Release с авто-changelog.
#
# Требуемые секреты репозитория:
#   KEYSTORE_BASE64   — release-keystore (.jks), закодированный base64
#   KEYSTORE_PASSWORD — пароль keystore
#   KEY_ALIAS         — алиас ключа
#   KEY_PASSWORD      — пароль ключа
#   GOOGLE_SERVICES_JSON_BASE64 — app/google-services.json (Firebase Crashlytics), base64;
#                                 не задан — релиз собирается без крэш-репортинга
on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: write   # нужно для создания GitHub Release
  actions: read     # «Ждём своей очереди» читает список запусков этого workflow

# Сборки тегов идут СТРОГО по одной, в порядке запуска (см. шаг «Ждём своей очереди»).
# Не `concurrency:` GitHub: тот держит в очереди только ОДИН ожидающий запуск и отменяет
# остальные — пуш четырёх тегов подряд потерял бы два релиза.
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Параллельные сборки нескольких тегов финишировали в случайном порядке, и бейдж
      # «Latest» (по нему приложение ищет обновление — `releases/latest`) доставался тому
      # релизу, который создался ПОЗЖЕ, а не тому, чей тег больше. Ждём, пока все запуски этого
      # workflow, стартовавшие раньше нашего (run id растёт монотонно), не завершатся.
      # Верхняя граница ожидания — страховка от зависшего соседа: дальше собираемся как есть,
      # бейдж «Latest» всё равно ставится по номеру тега (см. «Latest — только наибольший тег»).
      - name: Ждём своей очереди
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: ${{ github.workflow_ref }}
          MAX_WAIT_SEC: 5400
        run: |
          workflow="$(basename "${WORKFLOW_FILE%%@*}")"
          waited=0
          while :; do
            earlier=$(gh run list --workflow "$workflow" --limit 100 \
              --json databaseId,status,displayTitle \
              --jq "[.[] | select(.databaseId < ($RUN_ID | tonumber))
                         | select(.status | IN(\"queued\",\"in_progress\",\"waiting\",\"requested\",\"pending\"))
                         | \"\\(.databaseId) \\(.displayTitle)\"] | join(\", \")")
            if [ -z "$earlier" ]; then
              echo "Очередь свободна — собираем $TAG."
              break
            fi
            if [ "$waited" -ge "$MAX_WAIT_SEC" ]; then
              echo "::warning::Ждали ${waited} с, соседние запуски всё ещё идут ($earlier) — собираемся без очереди."
              break
            fi
            echo "Впереди: $earlier — ждём (${waited} с)…"
            sleep 30
            waited=$((waited + 30))
          done

      - name: Checkout (полная история + теги)
        uses: actions/checkout@v4
        with:
          # versionCode = число коммитов, versionName = из тега — нужна вся история.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Декодируем keystore из base64-секрета во временный файл раннера.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан — нечем подписывать release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/filmax-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/filmax-release.jks" >> "$GITHUB_ENV"

      # Crashlytics: конфиг Firebase из секрета. Файл в .gitignore (репо публичное), а его
      # наличие включает плагины google-services/crashlytics в app/build.gradle.kts —
      # вместе с ними в релиз уезжает и mapping-файл R8 для читаемых стектрейсов.
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::Секрет GOOGLE_SERVICES_JSON_BASE64 не задан — релиз без Crashlytics."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Assemble signed release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # In-app update: fine-grained токен (только чтение contents этого репо) зашивается в
          # APK, чтобы приложение читало Releases приватного репозитория. Не задан — сборка
          # пройдёт, но проверка обновлений в приложении будет молча выключена.
          UPDATE_GITHUB_TOKEN: ${{ secrets.UPDATE_GITHUB_TOKEN }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate & rename APK
        id: apk
        run: |
          path=$(find . -path '*/outputs/apk/release/*.apk' | head -n1)
          if [ -z "$path" ]; then echo "::error::release-APK не найден"; exit 1; fi
          version="${TAG#v}"
          dest="filmax-${version}.apk"
          cp "$path" "$dest"
          cp "$path" "filmax.apk"
          size_mb=$(( $(stat -c%s "$dest") / 1048576 ))
          {
            echo "path=$dest"
            echo "latest_path=filmax.apk"
            echo "version=$version"
            echo "size_mb=$size_mb"
          } >> "$GITHUB_OUTPUT"
          echo "APK: $dest and filmax.apk (${size_mb} МБ)"

      - name: Generate SHA-256 checksums
        id: checksums
        env:
          APK: ${{ steps.apk.outputs.path }}
          APK_LATEST: ${{ steps.apk.outputs.latest_path }}
        run: |
          sha256sum "$APK" "$APK_LATEST" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Авто-changelog из коммитов между предыдущим и текущим тегом.
      # Коммиты по Conventional Commits (feat/fix/perf/...), группируем по типам.
      - name: Generate changelog
        id: changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="${prev}..${TAG}"
            echo "Изменения с ${prev}:" > "$RUNNER_TEMP/changelog.md"
          else
            range="${TAG}"
            echo "Первый релиз Filmax." > "$RUNNER_TEMP/changelog.md"
          fi
          echo >> "$RUNNER_TEMP/changelog.md"
          emit() {
            local prefix="$1" title="$2"
            local lines
            lines=$(git log --no-merges --pretty='%s' "$range" | grep -E "^${prefix}(\(.+\))?(!)?: " || true)
            if [ -n "$lines" ]; then
              echo "### ${title}" >> "$RUNNER_TEMP/changelog.md"
              printf '%s\n' "$lines" | sed -E "s/^${prefix}(\(.+\))?(!)?: /- /" >> "$RUNNER_TEMP/changelog.md"
              echo >> "$RUNNER_TEMP/changelog.md"
            fi
          }
          emit "feat" "Новое"
          emit "fix"  "Исправления"
          emit "perf" "Производительность"
          # Фолбэк, если по конвенции ничего не распозналось.
          if [ "$(wc -l < "$RUNNER_TEMP/changelog.md")" -le 2 ]; then
            echo "### Коммиты" >> "$RUNNER_TEMP/changelog.md"
            git log --no-merges --pretty='- %s' "$range" >> "$RUNNER_TEMP/changelog.md"
          fi
          echo "---" >> "$RUNNER_TEMP/changelog.md"
          echo "versionName ${{ steps.apk.outputs.version }} · размер ${{ steps.apk.outputs.size_mb }} МБ" >> "$RUNNER_TEMP/changelog.md"
          echo "Собрано из тега \`${TAG}\`." >> "$RUNNER_TEMP/changelog.md"
          cat "$RUNNER_TEMP/changelog.md"

      # Бейдж «Latest» — по НОМЕРУ тега, а не по времени создания релиза (дефолт GitHub):
      # приложение берёт обновление из `releases/latest`, и пересборка старого тега (или
      # финиш отставшей параллельной сборки) не должна подменять свежую версию старой.
      # Теги перечитываем прямо сейчас: пока ждали очередь и собирались, мог приехать новый.
      - name: Latest — только наибольший тег
        id: latest
        run: |
          git fetch --tags --force --quiet
          highest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ "$highest" = "$TAG" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            echo "$TAG — наибольший тег, релиз станет Latest."
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "$TAG не наибольший (есть $highest) — релиз публикуется без бейджа Latest."
          fi

      # Идемпотентно: если Release уже есть (создан заранее через UI или прошлым прогоном) —
      # докладываем APK и обновляем заметки; иначе создаём. Так шаг не падает на «tag already exists».
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          APK_LATEST: ${{ steps.apk.outputs.latest_path }}
          CHECKSUMS: SHA256SUMS.txt
          TITLE: Filmax ${{ steps.apk.outputs.version }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK_LATEST" "$CHECKSUMS" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/changelog.md" \
              --latest="$LATEST"
            echo "GitHub Release $TAG обновлён (APK доложен, latest=$LATEST)."
          else
            gh release create "$TAG" "$APK" "$APK_LATEST" "$CHECKSUMS" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/changelog.md" \
              --latest="$LATEST"
            echo "GitHub Release $TAG опубликован (latest=$LATEST)."
          fi
